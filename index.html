<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITUNA - Paspor Lot Tuna</title>
    
    <!-- React & ReactDOM (Development Version untuk kemudahan deteksi eror) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel untuk kompilasi JSX di browser -->

    <!-- FontAwesome untuk Ikon -->

    <style>
        body { margin: 0; overflow-x: hidden; font-family: 'Inter', sans-serif; background-color: #caf0f8; color: #1e293b; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; }
        
        /* Organic Background Shapes - Glassmorphism Vibe */
        .bg-blobs {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(135deg, #0077b6 0%, #00b4d8 50%, #caf0f8 100%);
        }
        .blob {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            animation: morph 15s ease-in-out infinite alternate;
        }
        .blob-1 { width: 600px; height: 600px; top: -100px; left: -200px; background: rgba(144, 224, 239, 0.4); }
        .blob-2 { width: 500px; height: 500px; bottom: -100px; right: -100px; background: rgba(193, 188, 235, 0.3); animation-delay: 2s; }
        .blob-3 { width: 400px; height: 600px; top: 30%; left: 40%; background: rgba(0, 119, 182, 0.2); animation-delay: 4s; }

        @keyframes morph {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: rotate(0deg) scale(1); }
            100% { border-radius: 60% 40% 30% 70% / 60% 40% 50% 50%; transform: rotate(10deg) scale(1.1); }
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        .slide-up { animation: slideUp 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);

        ::-webkit-scrollbar-thumb { background: rgba(0, 180, 216, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 119, 182, 0.8); }

        #qr-reader {
            width: 100%; max-width: 400px; margin: 0 auto; border-radius: 1rem; overflow: hidden; border: 2px solid #00b4d8;
        }
    </style>
</head>
<body>
    <!-- Indikator Loading awal jika internet lambat -->

    <script type="text/babel">
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            componentDidCatch(error, errorInfo) {
                this.setState({ error: error, errorInfo: errorInfo });
                console.error("Terjadi kesalahan di React:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-rose-50 flex items-center justify-center p-8">
                            <div className="bg-white p-8 rounded-2xl shadow-xl max-w-2xl w-full border border-rose-200">
                                <h2 className="text-2xl font-bold text-rose-600 mb-4"><i className="fas fa-bug mr-2"></i>Sistem Berhenti Beroperasi (Crash)</h2>
                                <p className="text-gray-700 mb-4">Mohon maaf, terjadi kesalahan logika pada prototipe. Detail eror di bawah ini dapat membantu perbaikan:</p>
                                <pre className="bg-gray-900 text-green-400 p-4 rounded-xl overflow-x-auto text-xs font-mono mb-4">
                                    {this.state.error && this.state.error.toString()}
                                    <br/>
                                    {this.state.errorInfo && this.state.errorInfo.componentStack}
                                </pre>
                                <button onClick={() => window.location.reload()} className="bg-rose-600 text-white px-6 py-2 rounded-lg font-bold">Muat Ulang Halaman</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children; 
            }
        }

        const generateId = () => `SITUNA-${Math.floor(100000 + Math.random() * 900000)}`;

        // Simulasi Database Lot

                axisB_handling: 'tidak_terindikasi',
                axisC_quarantine: 'belum_diperiksa',

                massBalance: { in: 500, out: 488, diff: 12, pct: 2.4, status: 'bertentangan', tolerance: 1.0 },

                    { time: '2026-10-19 11:00', text: 'Kesenjangan log suhu logistik (4 jam kosong). Status diubah menjadi Perlu Ditinjau.', actor: 'Sistem Pusat' },

                ]
            }
        ];

        const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center fade-in px-4">
                    <div className="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl transform scale-100 transition-transform">
                        <div className="bg-rose-100 text-rose-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i className="fas fa-exclamation-triangle text-2xl"></i>
                        </div>
                        <h3 className="text-xl font-bold text-slate-800 text-center mb-2">{title}</h3>
                        <p className="text-sm text-slate-600 text-center mb-8">{message}</p>
                        <div className="flex gap-3 justify-center">
                            <button onClick={onCancel} className="px-5 py-2.5 text-sm font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition">Batal</button>

        };

        const Toast = ({ message, type, onClose }) => {
            React.useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColors = {
                success: 'bg-emerald-500',
                error: 'bg-rose-500',
                info: 'bg-situna-dark',
                warning: 'bg-amber-500'
            };

            return (
                <div className={`fixed top-8 left-1/2 transform -translate-x-1/2 z-[100] ${bgColors[type]} text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 slide-up border border-white/20`}>
                    <i className={`fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-times-circle' : type === 'warning' ? 'fa-exclamation-triangle' : 'fa-info-circle'} text-lg`}></i>
                    <span className="text-sm font-bold tracking-wide">{message}</span>
                </div>
            );
        };

        const StatusBadge = ({ type, status }) => {
            const configs = {
                evidence: {
                    'memadai': { color: 'bg-emerald-100 text-emerald-800 border-emerald-300', icon: 'fa-check-circle', label: 'Memadai' },
                    'belum_cukup': { color: 'bg-amber-100 text-amber-800 border-amber-300', icon: 'fa-exclamation-triangle', label: 'Belum Cukup' },
                    'bertentangan': { color: 'bg-rose-100 text-rose-800 border-rose-300', icon: 'fa-times-circle', label: 'Bertentangan' }
                },
                handling: {
                    'tidak_terindikasi': { color: 'bg-emerald-100 text-emerald-800', icon: 'fa-thermometer-empty', label: 'Aman' },
                    'perlu_ditinjau': { color: 'bg-amber-100 text-amber-800', icon: 'fa-thermometer-half', label: 'Tinjau' },
                    'terindikasi': { color: 'bg-rose-100 text-rose-800', icon: 'fa-thermometer-full', label: 'Penyimpangan' }
                },
                quarantine: {
                    'belum_diperiksa': { color: 'bg-slate-100 text-slate-600', icon: 'fa-clock', label: 'Belum Diperiksa' },
                    'dalam_pemeriksaan': { color: 'bg-blue-100 text-blue-800', icon: 'fa-microscope', label: 'Pemeriksaan' },
                    'lulus': { color: 'bg-emerald-100 text-emerald-800', icon: 'fa-stamp', label: 'Lulus Ekspor' },
                    'ditolak': { color: 'bg-rose-100 text-rose-800', icon: 'fa-ban', label: 'Ditolak' }
                }
            };
            const conf = configs[type][status] || configs[type]['belum_diperiksa'];
            return (
                <span className={`inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider border ${conf.color}`}>
                    <i className={`fas ${conf.icon} mr-1.5`}></i> {conf.label}
                </span>
            );
        };

        const TraceabilityTimeline = ({ currentStage, quarantineStatus }) => {
            const stages = [
                { id: 1, label: 'Penangkapan (Hulu)', icon: 'fa-ship', desc: 'Isi Logbook & SHTI Awal' },
                { id: 2, label: 'Pendaratan / TPI', icon: 'fa-anchor', desc: 'Bongkar, Timbang Aktual' },
                { id: 3, label: 'Pengolahan UPI', icon: 'fa-industry', desc: 'Fillet, Kemas, Bekukan' },
                { id: 4, label: 'Karantina Barantin', icon: 'fa-shield-virus', desc: 'Pemeriksaan Fisik & Lab' },
                { id: 5, label: 'Pelepasan Ekspor', icon: 'fa-plane-departure', desc: 'HC Terbit, Rilis Pasar' }
            ];

            return (
                <div className="w-full py-6">
                    <div className="flex justify-between relative mb-12">
                        {/* Background Line */}
                        <div className="absolute left-10 right-10 top-6 h-1.5 bg-slate-200 rounded-full z-0"></div>
                        
                        {/* Progress Line */}
                        <div 
                            className="absolute left-10 top-6 h-1.5 bg-situna-main rounded-full z-0 transition-all duration-1000 ease-in-out" 
                            style={{ width: `calc(${((currentStage - 1) / (stages.length - 1)) * 100}% - 40px)` }}
                        ></div>

                        {stages.map((stage) => {
                            const isCompleted = stage.id < currentStage;
                            const isCurrent = stage.id === currentStage;
                            
                            let statusColor = "bg-white text-slate-300 border-slate-300";
                            let pulse = false;

                            if (stage.id < currentStage) {
                                statusColor = "bg-emerald-500 text-white border-emerald-500 shadow-lg shadow-emerald-500/40"; 
                            } else if (stage.id === currentStage) {
                                if (stage.id === 5 && quarantineStatus === 'ditolak') {
                                    statusColor = "bg-rose-500 text-white border-rose-500 shadow-lg shadow-rose-500/40"; 
                                } else if (stage.id === 5 && quarantineStatus === 'lulus') {
                                    statusColor = "bg-emerald-500 text-white border-emerald-500 shadow-lg shadow-emerald-500/40"; 
                                } else {
                                    statusColor = "bg-situna-main text-white border-situna-main shadow-lg shadow-situna-main/50"; 
                                    pulse = true;
                                }
                            }

                            return (
                                <div key={stage.id} className="relative z-10 flex flex-col items-center w-1/5 group">
                                    <div className={`w-12 h-12 rounded-full flex items-center justify-center border-[3px] transition-all duration-300 bg-white ${statusColor} ${pulse ? 'animate-pulse' : ''} z-10`}>
                                        <i className={`fas ${stage.icon} text-lg ${isCompleted || isCurrent ? 'text-white' : 'text-slate-300'}`}></i>
                                    </div>
                                    <div className="absolute top-16 text-center w-full px-1">
                                        <p className={`text-xs font-bold leading-tight ${isCurrent ? 'text-situna-dark' : isCompleted ? 'text-emerald-700' : 'text-slate-400'}`}>
                                            {stage.label}
                                        </p>
                                        <p className="text-[9px] text-slate-400 mt-1 hidden md:block">{stage.desc}</p>
                                    </div>
                                </div>
                            );
                        })}

                </div>

        };

        const SplashScreen = ({ onFinish }) => {
            React.useEffect(() => {
                const timer = setTimeout(onFinish, 2500);
                return () => clearTimeout(timer);
            }, [onFinish]);

            return (

                        <svg width="120" height="120" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="white" strokeWidth="2" fill="white"/>
                            <path d="M7 13.5C7 13.5 8.5 12 11 12C13.5 12 16.5 14 18 11.5C18 11.5 15.5 9 11 9.5C6.5 10 5 13.5 5 13.5L7 13.5Z" fill="#0077b6"/>

                        </svg>
                    </div>
                    <h1 className="text-5xl font-poppins font-bold tracking-tight mb-2 drop-shadow-md">SITUNA</h1>

                        SISTEM INFORMASI<br/>KETELUSURAN IKAN TUNA<br/>NASIONAL
                    </p>
                    <div className="absolute bottom-10 flex flex-col items-center">
                        <div className="w-10 h-10 border-4 border-t-white border-white/20 rounded-full animate-spin mb-4"></div>

                            BADAN KARANTINA INDONESIA
                        </p>
                    </div>
                </div>

        };

        const LoginScreen = ({ onLogin }) => {
            const [role, setRole] = React.useState('admin');
            
            const handleLogin = (e) => {
                e.preventDefault();
                const user = initialUsers.find(u => u.role === role);
                onLogin(user);
            };

            return (
                <div className="flex items-center justify-center min-h-screen z-10 relative fade-in px-4">
                    <div className="glass-card p-10 rounded-3xl w-full max-w-md">
                        <div className="text-center mb-8">
                            <div className="bg-situna-dark rounded-2xl w-16 h-16 flex items-center justify-center mx-auto mb-6 shadow-xl text-white text-2xl transform rotate-3">
                                <i className="fas fa-fingerprint transform -rotate-3"></i>
                            </div>
                            <h2 className="text-3xl font-bold text-situna-dark mb-2">Akses Sistem</h2>
                            <p className="text-slate-500 text-sm">Role-Based Access Control (RBAC)</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-6">
                            <div>
                                <select 
                                    className="w-full border-2 border-white/50 bg-white/70 backdrop-blur-sm rounded-xl shadow-inner py-3 px-4 focus:ring-2 focus:ring-situna-main focus:border-situna-main text-slate-800 font-bold outline-none transition"
                                    value={role}
                                    onChange={(e) => setRole(e.target.value)}
                                >
                                    <option value="admin">Administrator Pusat (Semua Akses)</option>
                                    <option value="barantin">Petugas Karantina (Otoritas Sumbu C)</option>
                                    <option value="nelayan">Nelayan / Kapal (Hulu)</option>
                                    <option value="pengolahan">Unit Pengolahan / Pabrik</option>
                                </select>
                            </div>
                            <button type="submit" className="w-full bg-gradient-to-r from-situna-dark to-situna-main text-white font-bold py-3.5 px-4 rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-300 text-lg">
                                Masuk ke Prototipe
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ user, lots, onViewLot, onLogout, onCreateLot, showToast }) => {
            const [search, setSearch] = React.useState('');
            const [showCreateModal, setShowCreateModal] = React.useState(false);
            const [showQRScanner, setShowQRScanner] = React.useState(false);
            const scannerRef = React.useRef(null);
            
            const [formData, setFormData] = React.useState({
                species: 'Thunnus albacares (Madidihang)',
                weight: '',
                source: user.role === 'nelayan' ? 'Kapal Saya' : '',
                currentStage: 1
            });

            const stats = {
                total: lots.length,
                issues: lots.filter(l => l.axisA_evidence === 'bertentangan' || l.axisB_handling === 'terindikasi').length,
                pending: lots.filter(l => l.axisC_quarantine === 'belum_diperiksa').length
            };

            const filteredLots = lots.filter(l => 
                l.id.toLowerCase().includes(search.toLowerCase()) || 
                l.passportNo.toLowerCase().includes(search.toLowerCase())
            );

            // Setup QR Scanner when modal opens
            React.useEffect(() => {
                let html5QrcodeScanner = null;
                if (showQRScanner) {
                    html5QrcodeScanner = new Html5QrcodeScanner(
                        "qr-reader", { fps: 10, qrbox: 250 });
                    
                    html5QrcodeScanner.render((decodedText) => {
                        // On success
                        html5QrcodeScanner.clear();
                        setShowQRScanner(false);
                        
                        // Check if it's a valid URL or just ID
                        const idMatch = decodedText.match(/SITUNA-\d+/);
                        const targetId = idMatch ? idMatch[0] : decodedText;
                        
                        const foundLot = lots.find(l => l.id === targetId);
                        if (foundLot) {
                            showToast(`QR Berhasil Terbaca! Membuka ${foundLot.id}`, 'success');
                            onViewLot(foundLot);
                        } else {
                            showToast(`Lot dengan ID ${targetId} tidak ditemukan.`, 'error');
                        }
                    }, (err) => {
                        // ignore continuous errors
                    });
                }

                return () => {
                    if (html5QrcodeScanner) {
                        html5QrcodeScanner.clear().catch(error => {
                            console.error("Failed to clear html5QrcodeScanner. ", error);
                        });
                    }
                };
            }, [showQRScanner, lots]);

            const handleCreateSubmit = (e) => {
                e.preventDefault();
                if (!formData.weight || !formData.source) return;
                
                onCreateLot({
                    species: formData.species,
                    initialWeight: parseFloat(formData.weight),
                    source: formData.source,
                    currentStage: parseInt(formData.currentStage)

                                        <div className="text-slate-400 font-bold text-[10px] uppercase tracking-widest mb-4 border-b pb-2">Penelusuran Asal (Trace Backward)</div>
                                        {lot.parents.length === 0 ? <div className="text-slate-400 italic font-sans text-sm mb-6 flex items-center gap-2"><i className="fas fa-anchor"></i> Titik Nol (Sumber Tangkapan Utama)</div> : (
                                            <div className="mb-6 pl-4 border-l-2 border-indigo-300">
                                                <span className="font-bold text-slate-700">{lot.parents[0]}</span> <span className="text-xs text-slate-400 ml-2">(Sumber Induk Utama)</span>
                                            </div>
                                        )}
                                        <div className="bg-gradient-to-r from-situna-dark to-situna-main text-white p-5 rounded-2xl shadow-lg my-6 flex justify-between items-center transform scale-[1.02] z-10 relative">
                                            <div className="font-bold flex items-center gap-3"><i className="fas fa-box-open text-xl"></i> {lot.id}</div>
                                            <div className="bg-white/20 px-3 py-1 rounded-lg text-xs font-bold font-sans">Posisi Anda</div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB 3: NERACA (R2) */}
                            {activeTab === 'validasi_neraca' && (
                                <div className="fade-in space-y-4">
                                     <div className="p-5 bg-emerald-50 rounded-2xl border border-emerald-100 flex items-start gap-4">
                                        <div className="bg-emerald-100 w-10 h-10 flex items-center justify-center rounded-xl text-emerald-600 shrink-0"><i className="fas fa-balance-scale text-lg"></i></div>
                                        <div>
                                            <h4 className="font-bold text-emerald-900 text-sm mb-1">Validasi Neraca Massa UPI (Aturan R2)</h4>
                                            <p className="text-xs text-emerald-700 leading-relaxed">Sistem otomatis menghitung masuk-keluar (misal: 100kg utuh wajib jadi 40kg fillet + sisa). Jika perhitungan meleset melebihi toleransi (Contoh: {lot.massBalance.tolerance}%), sistem otomatis memberi tanda "Bertentangan".</p>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-slate-50 p-6 rounded-3xl border border-slate-100 text-center">
                                            <p className="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-2">Total Tercatat Masuk</p>
                                            <p className="text-4xl font-black text-slate-800">{lot.massBalance.in} <span className="text-sm font-bold text-slate-400">kg</span></p>
                                        </div>
                                        <div className="bg-slate-50 p-6 rounded-3xl border border-slate-100 text-center relative overflow-hidden">
                                            <p className="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-2">Total Diproses/Keluar</p>
                                            <p className={`text-4xl font-black ${lot.massBalance.status === 'bertentangan' ? 'text-rose-600' : 'text-emerald-600'}`}>{lot.massBalance.out} <span className="text-sm font-bold opacity-50">kg</span></p>
                                        </div>
                                    </div>

                                    <div className="bg-slate-900 rounded-3xl p-6 font-mono text-sm shadow-xl text-emerald-400 mt-4 relative overflow-hidden border border-slate-700">
                                        <div className="absolute right-0 top-0 opacity-10"><i className="fas fa-laptop-code text-8xl m-4"></i></div>
                                        <div className="text-slate-500 text-xs mb-4 font-bold">// Eksekusi Perhitungan Sistem R2 (Backend)</div>
                                        <div className="mb-1"><span className="text-slate-400">&gt; Menghitung selisih absolute:</span> | Masuk - Keluar |</div>
                                        <div className="mb-3">&gt; | {lot.massBalance.in} - {lot.massBalance.out} | = <span className="text-white font-bold">{lot.massBalance.diff} kg</span></div>
                                        <div className="mb-1 mt-2"><span className="text-slate-400">&gt; Kalkulasi Persentase:</span> ({lot.massBalance.diff} / {lot.massBalance.in}) * 100%</div>
                                        <div>&gt; = <span className="text-white font-bold">{lot.massBalance.pct}%</span></div>
                                        <div className={`mt-5 pt-5 border-t border-slate-700 font-bold ${lot.massBalance.pct > lot.massBalance.tolerance ? 'text-rose-400' : 'text-emerald-300'}`}>
                                            &gt; CEK AMBANG ({lot.massBalance.tolerance}%) =&gt; {lot.massBalance.pct > lot.massBalance.tolerance ? '🚨 BERTENTANGAN (Melebihi Toleransi)' : '✅ MEMADAI (Dalam Batas Aman)'}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB 4: SUHU & SERAH TERIMA (R4/R5) */}
                            {activeTab === 'suhu_logistik' && (
                                <div className="fade-in space-y-6">
                                    <div className="p-5 bg-amber-50 rounded-2xl border border-amber-100 flex items-start gap-4">
                                        <div className="bg-amber-100 w-10 h-10 flex items-center justify-center rounded-xl text-amber-600 shrink-0"><i className="fas fa-truck-fast text-lg"></i></div>
                                        <div>
                                            <h4 className="font-bold text-amber-900 text-sm mb-1">Serah Terima (R4) & Suhu Transportasi (R5)</h4>
                                            <p className="text-xs text-amber-700 leading-relaxed">Sopir pengirim dan pabrik penerima wajib validasi ganda. Jika sensor mati (jeda suhu), sistem tidak menolak otomatis, melainkan menandainya "Belum Cukup" agar diinvestigasi manual.</p>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
                                        <h4 className="font-bold text-slate-800 text-sm mb-5 border-b border-slate-100 pb-3 flex items-center gap-2"><i className="fas fa-handshake text-situna-main"></i> Status Serah Terima Terakhir</h4>
                                        <div className="flex flex-col md:flex-row items-center gap-4 justify-between bg-slate-50 p-5 rounded-2xl border border-slate-100">
                                            <div className="text-center md:text-left flex-1">
                                                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Pihak Pengirim</p>
                                                <p className="font-bold text-slate-700 text-sm">{lot.handover.sender}</p>
                                            </div>
                                            <div className="flex flex-col items-center flex-1">
                                                {lot.handover.status === 'pending' ? <span className="bg-amber-100 text-amber-700 text-[10px] font-bold px-4 py-1.5 rounded-full shadow-sm"><i className="fas fa-clock mr-1"></i>Menunggu</span> :
                                                 lot.handover.status === 'conflict' ? <span className="bg-rose-100 text-rose-700 text-[10px] font-bold px-4 py-1.5 rounded-full shadow-sm"><i className="fas fa-times mr-1"></i>Konflik Validasi</span> :
                                                 <span className="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-4 py-1.5 rounded-full shadow-sm"><i className="fas fa-check-double mr-1"></i>Valid (R4)</span>}
                                                <div className="h-px w-24 bg-slate-300 mt-3 relative"><div className="absolute right-0 top-1/2 transform -translate-y-1/2 -mt-[0.5px] w-2 h-2 bg-slate-400 rounded-full"></div></div>
                                            </div>
                                            <div className="text-center md:text-right flex-1">
                                                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Pihak Penerima</p>
                                                <p className="font-bold text-slate-700 text-sm">{lot.handover.receiver}</p>
                                            </div>
                                        </div>
                                    </div>

                                    {lot.temperatureGap && (
                                        <div className="bg-rose-50 border border-rose-200 p-5 rounded-3xl shadow-sm">
                                            <h4 className="font-bold text-rose-800 text-sm mb-2 flex items-center gap-2"><i className="fas fa-temperature-empty text-rose-500"></i> Peringatan Sensor Suhu</h4>
                                            <p className="text-xs text-rose-700 mb-4">Terdeteksi kesenjangan rekaman suhu (4 Jam). Status diturunkan ke "Belum Cukup". Menunggu investigasi manual otoritas.</p>
                                            {/* Dummy Graph */}
                                            <div className="h-12 w-full flex items-end gap-1 opacity-70">
                                                <div className="w-1/5 bg-situna-main h-4/5 rounded-t-sm"></div>
                                                <div className="w-1/5 bg-situna-dark h-full rounded-t-sm"></div>
                                                <div className="w-1/5 bg-rose-200 h-full border-2 border-dashed border-rose-400 rounded-sm flex items-center justify-center text-[8px] font-bold text-rose-600">GAP</div>
                                                <div className="w-1/5 bg-situna-dark h-5/6 rounded-t-sm"></div>
                                                <div className="w-1/5 bg-situna-main h-full rounded-t-sm"></div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* TAB 5: AUDIT (R7) */}
                            {activeTab === 'jejak_audit' && (
                                <div className="fade-in">
                                    <div className="p-5 bg-slate-800 rounded-2xl border border-slate-700 flex items-start gap-4 mb-8 shadow-lg">
                                        <div className="bg-slate-700 w-10 h-10 flex items-center justify-center rounded-xl text-white shrink-0"><i className="fas fa-shield-halved text-lg"></i></div>
                                        <div>
                                            <h4 className="font-bold text-white text-sm mb-1">Audit Trail Tak Terhapuskan (Aturan R7)</h4>
                                            <p className="text-xs text-slate-300 leading-relaxed">Ekosistem bertindak sebagai "hakim absolut". Nilai asli tidak akan pernah hilang. Sistem merekam nilai lama, alasan pengubahan, waktu diubah, dan ID perubah.</p>
                                        </div>
                                    </div>
                                    <div className="relative border-l-2 border-slate-200 ml-5 space-y-8 pb-4">
                                        {lot.history.map((log, index) => (
                                            <div key={index} className="relative pl-8 slide-up" style={{animationDelay: `${index * 0.1}s`}}>
                                                <div className="absolute w-5 h-5 bg-white border-4 border-situna-dark rounded-full -left-[11px] top-1 shadow-sm"></div>
                                                <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm transition hover:shadow-md">
                                                    <p className="font-bold text-slate-700 text-sm leading-snug">{log.text}</p>
                                                    <div className="flex flex-wrap gap-4 mt-3 pt-3 border-t border-slate-50">
                                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider"><i className="fas fa-user-tag mr-1.5 text-situna-main"></i> {log.actor}</p>
                                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider"><i className="fas fa-clock mr-1.5 text-situna-main"></i> {log.time}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Barantin Authority Panel (R6) */}
                    {user.role === 'barantin' && (
                        <div className="bg-gradient-to-r from-blue-900 to-slate-900 text-white rounded-3xl p-6 md:p-8 shadow-2xl border border-blue-700 relative overflow-hidden slide-up">
                            <div className="absolute right-0 top-0 opacity-5 transform scale-150 translate-x-10 -translate-y-10"><i className="fas fa-stamp text-9xl"></i></div>
                            <div className="relative z-10">
                                <h3 className="font-bold text-xl mb-2 flex items-center gap-3"><i className="fas fa-gavel text-amber-400 text-2xl"></i> Pemisahan Sumbu Status (Aturan R6)</h3>
                                <p className="text-xs text-blue-200 mb-6 max-w-3xl leading-relaxed">Indikator penyimpangan suhu dipisah mutlak dari status Karantina. Sistem TIDAK otomatis menyatakan produk Lulus/Tolak berdasarkan kelengkapan logistik. Wewenang absolut menerbitkan sertifikasi Karantina ada pada tombol di bawah ini (Khusus Barantin).</p>
                                
                                <div className="flex flex-wrap gap-4">
                                    <button onClick={() => handleQuarantineAction('dalam_pemeriksaan')} className="bg-white/10 hover:bg-white/20 border border-white/20 px-6 py-3.5 rounded-xl text-sm font-bold transition flex items-center gap-2 backdrop-blur-sm">
                                        <i className="fas fa-spinner"></i> Tahap Pemeriksaan
                                    </button>
                                    <button onClick={() => handleQuarantineAction('lulus')} className="bg-emerald-500 hover:bg-emerald-400 text-white px-6 py-3.5 rounded-xl text-sm font-bold transition shadow-lg shadow-emerald-500/30 flex items-center gap-2">
                                        <i className="fas fa-check-double text-lg"></i> Sertifikasi Karantina LULUS
                                    </button>
                                    <button onClick={() => handleQuarantineAction('ditolak')} className="bg-rose-600 hover:bg-rose-500 text-white px-6 py-3.5 rounded-xl text-sm font-bold transition shadow-lg shadow-rose-600/30 flex items-center gap-2">
                                        <i className="fas fa-ban text-lg"></i> Tolak / Tahan
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [view, setView] = React.useState('splash'); 
            const [user, setUser] = React.useState(null);
            const [lotsData, setLotsData] = React.useState(simulatedLots);
            const [selectedLot, setSelectedLot] = React.useState(null);
            const [toast, setToast] = React.useState({ show: false, message: '', type: 'info' });

            const showToast = (message, type = 'info') => {
                setToast({ show: true, message, type });
            };

            const handleLogin = (loggedInUser) => {
                setUser(loggedInUser);
                setView('dashboard');
                showToast(`Login berhasil sebagai ${loggedInUser.role.toUpperCase()}`, 'success');
            };

            const handleLogout = () => {
                setUser(null);
                setView('login');
            };

            // CREATE (Operasi CRUD Tambah)
            const handleCreateLot = (newLotData) => {
                const newLot = {
                    id: generateId(),
                    passportNo: `PS-2026-${String(lotsData.length + 1).padStart(3, '0')}`,
                    source: newLotData.source,
                    species: newLotData.species,
                    initialWeight: newLotData.initialWeight,
                    type: 'source',
                    parents: [],
                    date: new Date().toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' }),
                    currentStage: newLotData.currentStage,
                    axisA_evidence: 'memadai',
                    axisB_handling: 'tidak_terindikasi',
                    axisC_quarantine: 'belum_diperiksa',
                    temperatureGap: false,
                    massBalance: { in: newLotData.initialWeight, out: newLotData.initialWeight, diff: 0, pct: 0, status: 'memadai', tolerance: 1.0 },
                    handover: { sender: newLotData.source, receiver: 'Menunggu', status: 'pending' },
                    history: [
                        { time: new Date().toLocaleString('id-ID', { timeStyle: 'short' }), text: `Penerbitan Paspor Digital (Tahap ${newLotData.currentStage})`, actor: user.name }
                    ]
                };
                setLotsData([newLot, ...lotsData]); 
                showToast(`Paspor ${newLot.id} berhasil diterbitkan!`, 'success');
            };

            // DELETE (Operasi CRUD Hapus)
            const handleDeleteLot = (lotId) => {
                setLotsData(lotsData.filter(l => l.id !== lotId));
                setView('dashboard');
                showToast(`Paspor ${lotId} telah dihapus permanen.`, 'success');
            };

            // UPDATE (Operasi CRUD Update Status Karantina R6)
            const handleUpdateQuarantine = (lotId, newStatus) => {
                const updatedLots = lotsData.map(l => {
                    if (l.id === lotId) {
                        const stage = newStatus === 'lulus' || newStatus === 'ditolak' ? 5 : newStatus === 'dalam_pemeriksaan' ? 4 : l.currentStage;
                        return { 
                            ...l, 
                            axisC_quarantine: newStatus,
                            currentStage: stage,
                            history: [...l.history, { 
                                time: new Date().toLocaleString('id-ID', { timeStyle: 'short' }), 
                                text: `Wewenang Eksekusi Sumbu C (Karantina) diubah menjadi: ${newStatus.toUpperCase()}`, 
                                actor: user.name 
                            }]
                        };
                    }
                    return l;
                });
                setLotsData(updatedLots);
                setSelectedLot(updatedLots.find(l => l.id === lotId));
                showToast(`Status diperbarui menjadi ${newStatus.toUpperCase()}`, 'success');
            };

            return (
                <ErrorBoundary>
                    <div className="min-h-screen relative overflow-x-hidden selection:bg-situna-main selection:text-white">
                        <div className="bg-blobs">
                            <div className="blob blob-1"></div><div className="blob blob-2"></div><div className="blob blob-3"></div>
                        </div>

                        {toast.show && <Toast message={toast.message} type={toast.type} onClose={() => setToast({...toast, show: false})} />}

                        {view === 'splash' && <SplashScreen onFinish={() => setView('login')} />}
                        {view === 'login' && <LoginScreen onLogin={handleLogin} />}
                        {view === 'dashboard' && <Dashboard user={user} lots={lotsData} onViewLot={lot => { setSelectedLot(lot); setView('lot_detail'); }} onLogout={handleLogout} onCreateLot={handleCreateLot} showToast={showToast} />}
                        {view === 'lot_detail' && <LotDetail lot={selectedLot} user={user} onBack={() => { setSelectedLot(null); setView('dashboard'); }} onUpdateQuarantine={handleUpdateQuarantine} onDeleteLot={handleDeleteLot} showToast={showToast} />}
                    </div>
                </ErrorBoundary>
            );
        };

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
