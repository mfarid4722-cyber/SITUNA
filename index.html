<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITUNA - Sistem Informasi Ketertelusuran Ikan Tuna Nasional</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- QRious Library untuk QR Code Asli -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <!-- html2pdf Library untuk Export Sertifikat PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Konfigurasi Tema Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        display: ['Poppins', 'sans-serif']
                    },
                    colors: {
                        situna: { dark: '#0077b6', main: '#00b4d8', light: '#90e0ef', bg: '#caf0f8' }
                    }
                }
            }
        }
    </script>
    <style>
        body { margin: 0; background-color: #caf0f8; font-family: 'Inter', sans-serif; color: #1e293b; overflow-x: hidden; }
        h1, h2, h3, h4, h5 { font-family: 'Poppins', sans-serif; }
        
        /* Animasi Background Lautan Organik */
        .bg-blobs { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: linear-gradient(135deg, #0077b6 0%, #00b4d8 50%, #caf0f8 100%); overflow: hidden; }
        .blob { position: absolute; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; animation: morph 15s ease-in-out infinite alternate; }
        .blob-1 { width: 600px; height: 600px; top: -100px; left: -200px; background: rgba(144, 224, 239, 0.4); }
        .blob-2 { width: 500px; height: 500px; bottom: -100px; right: -100px; background: rgba(255, 255, 255, 0.2); animation-delay: 2s; }
        @keyframes morph { 0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: rotate(0deg) scale(1); } 100% { border-radius: 60% 40% 30% 70% / 60% 40% 50% 50%; transform: rotate(10deg) scale(1.1); } }

        /* Utilitas Animasi Masuk */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Komponen Glassmorphism */
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px rgba(0, 119, 182, 0.1); }
        
        /* Scrollbar Halus */
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(0, 180, 216, 0.5); border-radius: 10px; }
        
        .step-circle { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; position: relative; z-index: 10; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const generateID = () => `SITUNA-${Math.floor(100000 + Math.random() * 900000)}`;

        const usersDB = [
            { id: 'u1', username: 'admin', password: '123', role: 'admin', name: 'Administrator Pusat' },
            { id: 'u2', username: 'karantina', password: '123', role: 'karantina', name: 'Petugas Barantin' },
            { id: 'u3', username: 'nelayan', password: '123', role: 'nelayan', name: 'Kapten Kapal' },
            { id: 'u4', username: 'pengolah', password: '123', role: 'pengolah', name: 'Pabrik Pengolah' }
        ];

        const STAGES = { 1: "Tangkapan Terdaftar", 2: "Selesai Diproses (UPI)", 3: "Dalam Inspeksi", 4: "Lulus Ekspor" };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); }, [onClose]);
            const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-situna-dark' };
            return (
                <div className={`fixed top-6 left-1/2 transform -translate-x-1/2 z-[100] ${colors[type]} text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 fade-in font-medium tracking-wide`}>
                    <i className={`fas ${type === 'success' ? 'fa-check' : type === 'error' ? 'fa-times' : 'fa-info-circle'}`}></i> {message}
                </div>
            );
        };

        const useSharedDatabase = () => {
            const [lots, setLots] = useState(() => {
                const saved = localStorage.getItem('situna_db_v_final_v3');
                return saved ? JSON.parse(saved) : [];
            });
            const channel = useMemo(() => new BroadcastChannel('situna_sync_final_v3'), []);

            useEffect(() => {
                channel.onmessage = (event) => {
                    if (event.data.type === 'SYNC') {
                        setLots(event.data.payload);
                        localStorage.setItem('situna_db_v_final_v3', JSON.stringify(event.data.payload));
                    }
                };
                return () => channel.close();
            }, [channel]);

            const updateDB = (newLots) => {
                setLots(newLots);
                localStorage.setItem('situna_db_v_final_v3', JSON.stringify(newLots));
                channel.postMessage({ type: 'SYNC', payload: newLots });
            };
            return [lots, updateDB];
        };

        const Badge = ({ label, color }) => (
            <span className={`inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider ${color}`}>{label}</span>
        );

        const SplashScreen = ({ onFinish }) => {
            useEffect(() => {
                const timer = setTimeout(onFinish, 2500);
                return () => clearTimeout(timer);
            }, [onFinish]);

            return (
                <div className="flex flex-col items-center justify-center min-h-screen text-white fade-in relative z-10">
                    <div className="mb-6 transform transition hover:scale-105 flex justify-center">
                        {/* Menghapus shape, memberi efek bayangan gelap agar logo putih tetap terlihat */}
                        <img src="logo.png" alt="Logo" className="w-[150px] h-[150px] object-contain drop-shadow-[0_0_15px_rgba(0,0,0,0.4)]" onError={(e) => { e.target.onerror = null; e.src = './logo.png'; }} />
                    </div>
                    
                    <div className="absolute bottom-10 flex flex-col items-center">
                        <div className="w-10 h-10 border-4 border-t-white border-white/20 rounded-full animate-spin mb-4"></div>
                        <p className="text-sm font-bold tracking-wider opacity-90 drop-shadow text-center leading-tight">
                            BADAN KARANTINA NASIONAL<br/>REPUBLIK INDONESIA
                        </p>
                    </div>
                </div>
            );
        };

        const LoginScreen = ({ onLogin }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                const u = usersDB.find(x => x.username === username && x.password === password);
                if (u) onLogin(u); else setError('Username atau password salah!');
            };

            return (
                <div className="flex items-center justify-center min-h-screen z-10 relative px-4">
                    <div className="glass-card p-10 rounded-3xl w-full max-w-md fade-in relative overflow-hidden">
                        <div className="text-center mb-6">
                            {/* Kotak biru dihapus. Logo asli dibesarkan (150px) dengan drop shadow kuat */}
                            <div className="flex justify-center mb-6">
                                <img src="logo.png" alt="SITUNA Logo" className="w-[150px] h-[150px] object-contain drop-shadow-[0_0_15px_rgba(0,0,0,0.5)]" onError={(e) => { e.target.onerror = null; e.src = './logo.png'; }} />
                            </div>
                            <h2 className="text-3xl font-display font-bold text-situna-dark">SITUNA Login</h2>
                        </div>
                        {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-100 flex items-center gap-2"><i className="fas fa-exclamation-circle"></i> {error}</div>}
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input type="text" required value={username} onChange={e => setUsername(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-situna-main text-sm" placeholder="Username (cth: nelayan)" />
                            <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-situna-main text-sm" placeholder="Password (123)" />
                            <button type="submit" className="w-full bg-situna-dark hover:bg-situna-main text-white font-bold py-3.5 rounded-xl transition shadow-lg mt-2">Masuk Sistem</button>
                        </form>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ user, lots, updateLots, onLogout, showToast, onViewDetail }) => {
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [form, setForm] = useState({ species: 'Thunnus albacares', weight: '', wpp: '', temp: '', docName: '' });

            const handleCreate = (e) => {
                e.preventDefault();
                const newLot = {
                    id: generateID(), stage: 1, type: 'source', parents: [],
                    species: form.species, weight: parseFloat(form.weight),
                    catchInfo: { wpp: form.wpp, temp: form.temp, doc: form.docName || 'Logbook_SHTI.pdf' },
                    axisA: 'memadai', axisB: 'tidak_terindikasi', axisC: 'belum_diperiksa',
                    handover: { status: 'Di Pelabuhan', sender: user.name, receiver: null, senderW: parseFloat(form.weight), receiverW: null },
                    processInfo: null, labInfo: null, tempGap: false,
                    creator: user.name, createdAt: new Date().toLocaleString('id-ID'),
                    history: [{ time: new Date().toLocaleString('id-ID'), actor: user.name, action: `Registrasi tangkapan hulu. WPP: ${form.wpp}, Suhu: ${form.temp}°C, Bobot: ${form.weight}kg` }]
                };
                updateLots([newLot, ...lots]);
                setShowCreateModal(false);
                setForm({ species: 'Thunnus albacares', weight: '', wpp: '', temp: '', docName: '' });
                showToast(`Paspor ${newLot.id} tercatat di sistem utama!`, 'success');
            };

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-6xl mx-auto fade-in pb-20">
                    <header className="glass-card p-6 rounded-3xl mb-8 flex justify-between items-center shadow-md">
                        <div className="flex items-center gap-4 md:gap-5">
                            {/* Shape dihilangkan. Ukuran logo dibesarkan jadi 120px dengan drop shadow */}
                            <div className="flex items-center justify-center shrink-0">
                                <img src="logo.png" alt="BKN Logo" className="w-[120px] h-[120px] object-contain drop-shadow-[0_0_12px_rgba(0,0,0,0.4)]" onError={(e) => { e.target.onerror = null; e.src = './logo.png'; }} />
                            </div>
                            <div>
                                <h1 className="text-xl md:text-2xl font-display font-bold text-situna-dark leading-tight">BADAN KARANTINA NASIONAL</h1>
                                <p className="text-[10px] md:text-xs text-gray-500 font-bold tracking-wide mt-0.5">SISTEM INFORMASI KETERTELUSURAN IKAN TUNA NASIONAL</p>
                            </div>
                        </div>
                        
                        <div className="flex items-center gap-3 bg-white/70 p-2 pl-4 rounded-2xl border border-white shrink-0">
                            <div className="text-right hidden sm:block pr-2 border-r border-gray-200">
                                <p className="text-sm font-bold text-gray-800">{user.name}</p>
                                <p className="text-[10px] font-bold text-situna-main uppercase tracking-wider">{user.role}</p>
                            </div>
                            <button onClick={onLogout} className="bg-red-50 hover:bg-red-500 text-red-500 hover:text-white w-10 h-10 rounded-xl transition flex items-center justify-center ml-1" title="Keluar"><i className="fas fa-power-off"></i></button>
                        </div>
                    </header>

                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold text-gray-800">Daftar Paspor Lot</h2>
                        {(user.role === 'nelayan' || user.role === 'admin') && (
                            <button onClick={() => setShowCreateModal(true)} className="bg-situna-dark hover:bg-situna-main text-white px-5 py-2.5 rounded-xl font-bold transition shadow-lg flex items-center gap-2">
                                <i className="fas fa-plus"></i> <span className="hidden md:inline">Registrasi Tangkapan</span>
                            </button>
                        )}
                    </div>

                    {lots.length === 0 ? (
                        <div className="glass-card rounded-3xl p-12 text-center border-dashed border-2 border-gray-300">
                            <div className="w-20 h-20 bg-gray-100 text-gray-400 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl"><i className="fas fa-ship"></i></div>
                            <h3 className="text-xl font-bold text-gray-700 mb-2">Area Pendaratan Kosong</h3>
                            <p className="text-gray-500 text-sm">Masuk sebagai Nelayan untuk memulai pencatatan rantai pasok.</p>
                        </div>
                    ) : (
                        <div className="glass-card rounded-3xl overflow-hidden shadow-lg">
                            <table className="w-full text-left">
                                <thead className="bg-gray-50 border-b border-gray-100">
                                    <tr className="text-xs text-gray-400 uppercase font-bold">
                                        <th className="p-5">ID Paspor</th>
                                        <th className="p-5">Spesies / Asal</th>
                                        <th className="p-5">Tahap & Bobot</th>
                                        <th className="p-5 text-right">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {lots.map(lot => (
                                        <tr key={lot.id} className="hover:bg-blue-50/30 transition">
                                            <td className="p-5">
                                                <div className="font-bold text-situna-dark text-sm">{lot.id}</div>
                                                <div className="text-[10px] text-gray-400 mt-1">{lot.createdAt}</div>
                                            </td>
                                            <td className="p-5">
                                                <div className="font-bold text-gray-800 text-sm">{lot.species}</div>
                                                <div className="text-xs text-gray-500 mt-0.5">WPP: {lot.catchInfo?.wpp || '-'}</div>
                                            </td>
                                            <td className="p-5">
                                                <Badge label={STAGES[lot.stage]} color={lot.stage === 4 ? 'bg-green-100 text-green-700' : lot.stage === 3 ? 'bg-yellow-100 text-yellow-700' : 'bg-blue-100 text-blue-700'} />
                                                <div className="text-xs font-bold text-gray-600 mt-1">{lot.weight} kg</div>
                                            </td>
                                            <td className="p-5 text-right">
                                                <button onClick={() => onViewDetail(lot.id)} className="bg-white border border-gray-200 hover:border-situna-main text-situna-dark px-4 py-2 rounded-xl text-xs font-bold transition shadow-sm">Detail Terpadu</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {showCreateModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-3xl p-8 max-w-lg w-full shadow-2xl overflow-y-auto max-h-[90vh]">
                                <h3 className="text-xl font-bold text-gray-800 mb-2 flex items-center gap-3"><i className="fas fa-ship text-situna-dark"></i> Pendaratan Ikan</h3>
                                <p className="text-xs text-gray-500 mb-6">Data ini menjadi silsilah awal yang tidak bisa diubah.</p>
                                
                                <form onSubmit={handleCreate} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="col-span-2"><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Spesies Ikan</label><select value={form.species} onChange={e=>setForm({...form, species: e.target.value})} className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 text-sm"><option value="Thunnus albacares (Yellowfin)">Yellowfin Tuna</option><option value="Thunnus obesus (Bigeye)">Bigeye Tuna</option></select></div>
                                        <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Kode WPP RI</label><input required type="text" value={form.wpp} onChange={e=>setForm({...form, wpp: e.target.value})} placeholder="Cth: 714" className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 text-sm" /></div>
                                        <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Suhu Palka (°C)</label><input required type="number" step="0.1" value={form.temp} onChange={e=>setForm({...form, temp: e.target.value})} placeholder="-18" className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 text-sm" /></div>
                                        <div className="col-span-2"><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Bobot Pendaratan (kg)</label><input required type="number" step="0.1" value={form.weight} onChange={e=>setForm({...form, weight: e.target.value})} placeholder="Bobot aktual" className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 font-bold text-lg" /></div>
                                        <div className="col-span-2"><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Lampirkan Bukti (Logbook/SHTI)</label><div className="border-2 border-dashed border-gray-300 rounded-xl p-4 bg-gray-50"><input type="file" onChange={e => setForm({...form, docName: e.target.files[0]?.name})} className="text-xs text-gray-500 w-full" accept=".pdf,image/*" /></div></div>
                                    </div>
                                    <div className="flex gap-3 pt-4 border-t border-gray-100">
                                        <button type="button" onClick={() => setShowCreateModal(false)} className="flex-1 py-3 rounded-xl font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 transition">Batal</button>
                                        <button type="submit" className="flex-1 py-3 rounded-xl font-bold text-white bg-situna-dark hover:bg-situna-main transition shadow-md">Terbitkan Paspor</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const LotDetail = ({ lotId, lots, user, onBack, updateLots, showToast }) => {
            const lot = lots.find(l => l.id === lotId);
            const [tab, setTab] = useState('Inspeksi & Lab');

            const qrRef = useRef(null);
            const [serahForm, setSerahForm] = useState({ rWeight: '' });
            const [neracaForm, setNeracaForm] = useState({ prod: '', byprod: '', shrink: '' });
            const [pecahForm, setPecahForm] = useState({ w1: '', w2: '' });
            const [labForm, setLabForm] = useState({ histamine: '', salmonella: 'Negatif', metals: 'Aman' });
            const [koreksiForm, setKoreksiForm] = useState({ field: 'Bobot', oldVal: lot?.weight || '', newVal: '', reason: '' });

            useEffect(() => {
                if (qrRef.current && window.QRious) {
                    new QRious({ element: qrRef.current, value: `https://situna.go.id/verify/${lot.id}`, size: 130, background: 'white', foreground: '#0f172a' });
                }
            }, [lot]);

            if (!lot) return null;

            const handleKirim = () => {
                const updated = { ...lot, handover: { ...lot.handover, status: 'Menunggu Penerima' }, history: [...lot.history, { time: new Date().toLocaleString(), actor: user.name, action: `Dikirim ke fasilitas pengolahan. Menunggu konfirmasi penerima.`}] };
                updateLots(lots.map(l => l.id === lot.id ? updated : l)); showToast("Dikirim untuk Serah Terima.", "info");
            };
            const handleTerima = (e) => {
                e.preventDefault(); const rW = parseFloat(serahForm.rWeight);
                const updated = { ...lot, axisA: rW !== lot.handover.senderW ? 'belum_cukup' : lot.axisA, handover: { ...lot.handover, status: 'Diterima', receiver: user.name, receiverW: rW }, history: [...lot.history, { time: new Date().toLocaleString(), actor: user.name, action: `Konfirmasi Terima Dokumen. Bobot: ${rW}kg.`}] };
                updateLots(lots.map(l => l.id === lot.id ? updated : l)); showToast("Konfirmasi serah terima disimpan.", "success");
            };
            const handleNeraca = (e) => {
                e.preventDefault(); const p = parseFloat(neracaForm.prod); const b = parseFloat(neracaForm.byprod); const s = parseFloat(neracaForm.shrink);
                const total = p + b + s; const diff = Math.abs(lot.weight - total);
                const updated = { ...lot, weight: p, stage: 2, axisA: diff > (lot.weight * 0.01) ? 'bertentangan' : lot.axisA, processInfo: { product: p, byproduct: b, shrink: s, diff, original: lot.weight }, history: [...lot.history, { time: new Date().toLocaleString(), actor: user.name, action: `Uji Neraca Massa UPI. In: ${lot.weight}, Out: ${total}. Selisih: ${diff.toFixed(2)}kg.`}] };
                updateLots(lots.map(l => l.id === lot.id ? updated : l)); showToast("Neraca massa dihitung.", "success");
            };
            const handlePecah = (e) => {
                e.preventDefault(); const w1 = parseFloat(pecahForm.w1); const w2 = parseFloat(pecahForm.w2);
                if (w1 + w2 > lot.weight) { showToast("Gagal: Melebihi bobot induk!", "error"); return; }
                const base = { type: 'split', parents: [lot.id], stage: lot.stage, catchInfo: lot.catchInfo, processInfo: lot.processInfo, axisA: lot.axisA, axisB: lot.axisB, axisC: lot.axisC, handover: lot.handover, tempGap: lot.tempGap, creator: user.name, createdAt: new Date().toLocaleString() };
                const c1 = { ...base, id: generateID(), species: `${lot.species} (Pecahan 1)`, weight: w1, history: [{ time: new Date().toLocaleString(), actor: user.name, action: `Silsilah Turunan dari Induk ${lot.id}.`}] };
                const c2 = { ...base, id: generateID(), species: `${lot.species} (Pecahan 2)`, weight: w2, history: [{ time: new Date().toLocaleString(), actor: user.name, action: `Silsilah Turunan dari Induk ${lot.id}.`}] };
                const upInduk = { ...lot, history: [...lot.history, { time: new Date().toLocaleString(), actor: user.name, action: `Dipecah menjadi turunan ${c1.id} & ${c2.id}.`}] };
                updateLots([c1, c2, upInduk, ...lots.filter(l => l.id !== lot.id)]); showToast("Lot berhasil dipecah.", "success");
            };
            const handleLabTest = (e, decision) => {
                e.preventDefault(); const newStage = decision === 'Lulus' ? 4 : 3;
                const updated = { ...lot, stage: newStage, axisC: decision.toLowerCase(), labInfo: { ...labForm, decision }, history: [...lot.history, { time: new Date().toLocaleString(), actor: user.name, action: `Inspeksi Lab. Keputusan: ${decision}. Histamin: ${labForm.histamine}ppm.`}] };
                updateLots(lots.map(l => l.id === lot.id ? updated : l)); showToast(`Status Inspeksi: ${decision}`, decision === 'Lulus' ? 'success' : 'error');
            };
            const simulasikanSuhu = () => {
                const updated = { ...lot, tempGap: true, axisA: 'belum_cukup', history: [...lot.history, { time: new Date().toLocaleString(), actor: user.name, action: `Terdeteksi kesenjangan log suhu. Kelengkapan Bukti diturunkan.`}] };

                                                        <div><label className="block text-[10px] font-bold text-gray-500 mb-1 uppercase">Sampingan (kg)</label><input required type="number" step="0.1" value={neracaForm.byprod} onChange={e=>setNeracaForm({...neracaForm, byprod: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                                                        <div><label className="block text-[10px] font-bold text-gray-500 mb-1 uppercase">Susut (kg)</label><input required type="number" step="0.1" value={neracaForm.shrink} onChange={e=>setNeracaForm({...neracaForm, shrink: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                                                        <button type="submit" className="col-span-3 bg-situna-main text-white py-2.5 rounded-lg text-xs font-bold shadow-md mt-2">Kalkulasi Neraca Massa</button>
                                                    </form>
                                                ) : <p className="text-sm text-gray-400 italic text-center py-6">Syarat: Lot harus sudah dikonfirmasi terima oleh UPI.</p>
                                            )}
                                        </div>
                                    )}

                                    {tab === TABS[3] && (
                                        <div className="space-y-6 fade-in">

                                            {user.role === 'pengolah' && (

                                    {tab === TABS[4] && (
                                        <div className="space-y-6 fade-in">
                                            <div className="border rounded-xl p-6 bg-white text-center">
                                                {lot.tempGap ? (
                                                    <div><i className="fas fa-exclamation-triangle text-yellow-500 text-4xl mb-3"></i><h4 className="font-bold text-gray-800">Kesenjangan Suhu Terdeteksi</h4><p className="text-xs text-gray-500 mt-2">Ditemukan Blank Spot pada log data. Status Bukti diturunkan, menanti koreksi berbukti.</p></div>

                                                )}
                                            </div>
                                            {user.role === 'admin' && !lot.tempGap && <button onClick={simulasikanSuhu} className="w-full bg-yellow-100 text-yellow-700 py-2 rounded-lg font-bold text-xs border border-yellow-200"><i className="fas fa-magic mr-1"></i> Simulasikan Alat Sinyal Hilang</button>}
                                        </div>
                                    )}

                                    {tab === TABS[5] && (
                                        <div className="space-y-6 fade-in">
                                            <div className="bg-blue-50 text-blue-800 p-4 rounded-xl text-sm border border-blue-100"><i className="fas fa-shield-alt mr-2"></i><strong>Ketentuan Audit Koreksi:</strong> Jejak operasional tidak dapat dihapus. Perbaikan data wajib menyertakan nilai lama, nilai baru, dan keterangan koreksi yang sah.</div>

                                            {user.role === 'admin' && (

                                                    <div><label className="block text-xs text-orange-700 mb-1">Nilai Perbaikan (Bobot)</label><input required type="number" step="0.1" value={koreksiForm.newVal} onChange={e=>setKoreksiForm({...koreksiForm, newVal: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>

                    <div className="bg-blobs"><div className="blob blob-1"></div><div className="blob blob-2"></div></div>
                    {toast.show && <Toast message={toast.message} type={toast.type} onClose={() => setToast({ show: false, message: '', type: '' })} />}
                    
                    {view === 'splash' && <SplashScreen onFinish={() => setView('login')} />}
                    {view === 'login' && <LoginScreen onLogin={handleLogin} />}
                    {view === 'dashboard' && !activeLotId && <Dashboard user={user} lots={lots} updateLots={updateLots} onViewDetail={id => setActiveLotId(id)} onLogout={() => { setUser(null); setView('login'); }} showToast={showToast} />}
                    {view === 'dashboard' && activeLotId && <LotDetail lotId={activeLotId} lots={lots} user={user} updateLots={updateLots} onBack={() => setActiveLotId(null)} showToast={showToast} />}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
